name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      goldens:
        description: Run golden tests against existing baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Generate code
        run: >-
          dart run melos exec --concurrency=1 --order-dependents
          --depends-on=build_runner -- dart run build_runner build

      - name: Check formatting
        run: >-
          git ls-files -z '*.dart' ':!:*.g.dart' ':!:*.freezed.dart' |
          xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze workspace
        run: dart analyze --fatal-infos

      # These apps demonstrate failed and flaky reports as well as passing tests.
      # Keep the intentional failures out of the required regression checks.
      - name: Test Dart example
        working-directory: apps/plain_dart_package
        run: dart test --reporter=expanded --name='^(?!.*Failing Test).*$'

      - name: Test Flutter sandbox
        working-directory: apps/sandbox
        run: >-
          flutter test --dart-define=CI=true --coverage --reporter=expanded
          --exclude-tags=golden
          --name='^(?!.*(?:Known:|Flaky|Muted: int.parse fails)).*$'

      # Existing golden baselines need reconciliation with current Flutter.
      - name: Test CI goldens
        if: ${{ inputs.goldens == true }}
        working-directory: apps/sandbox
        run: flutter test --dart-define=CI=true --tags=golden --reporter=expanded

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/sandbox/coverage/
            **/test/**/failures/
            **/allure-results/
            **/reports/
